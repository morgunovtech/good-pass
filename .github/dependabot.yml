# One grouped PR per week with every npm update, monthly PRs for the
# Actions. CI checks them; minor and patch bumps merge on their own once CI
# is green (workflows/dependabot-automerge.yml), majors wait for a human.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: saturday
    groups:
      npm-deps:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
