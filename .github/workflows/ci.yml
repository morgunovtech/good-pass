name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test · audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm
      # No dependency needs an install script; a compromised one cannot run code here.
      - run: npm ci --ignore-scripts
      - run: npm test
      # High and critical advisories in runtime dependencies fail the build —
      # a Dependabot bump is the fix.
      - run: npm audit --omit=dev --audit-level=high

  # Public repos get GitHub secret scanning, but a push protection miss or an
  # old commit still slips through; gitleaks scans the whole history on every
  # run so a leaked token fails the PR, not the audit.
  secrets:
    name: secrets
    # The action lists the PR's commits through the API; the default token
    # cannot read pull requests.
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
